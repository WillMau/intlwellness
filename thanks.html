<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Thank you · INTL Wellness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .thanks {
      min-height: 100svh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      background:
        radial-gradient(120% 90% at 80% -10%, color-mix(in srgb, var(--sea) 28%, transparent), transparent 55%),
        radial-gradient(90% 80% at 8% 110%, color-mix(in srgb, var(--sea-deep) 22%, transparent), transparent 50%),
        var(--sand);
    }
    .thanks__card { max-width: 34rem; }
    .thanks__mark {
      display: inline-flex; align-items: center; gap: 0.55rem; margin-bottom: 2.5rem;
      color: var(--sea-deep); font-family: var(--display); font-size: 1.4rem;
    }
    .thanks__mark svg { width: 24px; height: 24px; }
    .thanks h1 {
      font-family: var(--display); font-weight: 300;
      font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: 1.05; letter-spacing: -0.02em;
      color: var(--ink);
    }
    .thanks p { margin-top: 1.25rem; color: var(--ink-soft); font-size: 1.075rem; line-height: 1.65; }
    .thanks .btn { margin-top: 2.25rem; }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="thanks">
    <div class="thanks__card">
      <span class="thanks__mark">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M2 12c3.5 0 3.5 3 7 3s3.5-3 7-3 3.5 3 7 3 3.5-3 7-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M2 19c3.5 0 3.5 3 7 3s3.5-3 7-3 3.5 3 7 3 3.5-3 7-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
        </svg>
        INTL Wellness
      </span>
      <h1 id="thanksTitle">Thank you.</h1>
      <p id="thanksBody">We've got it. We read every note personally, and we'll be in touch soon.</p>
      <a href="/" class="btn btn--solid">Back to home</a>
    </div>
  </main>

  <script>
    // Tailor the message to which form was submitted (?f=waitlist | assessment).
    (function () {
      var f = new URLSearchParams(location.search).get("f");
      var title = document.getElementById("thanksTitle");
      var body = document.getElementById("thanksBody");
      if (f === "waitlist") {
        title.textContent = "You're on the list.";
        body.textContent = "Thank you for reserving your place among the founding members. We'll be in touch as spots open.";
      } else if (f === "assessment") {
        title.textContent = "Thank you.";
        body.textContent = "Your assessment is in — this is the beginning of the conversation. We'll review what you shared and reach out to map your first steps together.";
      }
    })();
  </script>
</body>
</html>
